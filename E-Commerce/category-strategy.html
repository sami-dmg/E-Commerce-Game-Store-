<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy-Game Center</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-pink-50 via-purple-50 to-blue-50">

<nav class="bg-purple-600 text-white p-4 shadow-lg flex justify-between items-center">
  <h1 class="text-3xl font-bold hover:text-yellow-300 cursor-pointer" onclick="window.location.href='index.html'">Game Center</h1>
  <button onclick="window.location.href='index.html#cart'" class="bg-yellow-400 text-black px-4 py-2 rounded-xl font-bold hover:bg-yellow-500">Go to Cart</button>
</nav>

<section class="p-6 mt-8">
  <h2 class="text-2xl font-bold mb-6 text-purple-700">Strategy Games</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <div class="bg-white rounded-3xl shadow-xl p-5 flex flex-col items-center">
      <img src="images/coc.jpg" alt="Gift Box" class="rounded-2xl mb-4">
      <h3 class="font-bold text-lg text-gray-800">Clash Of Clans</h3>
      <p class="text-gray-500">$40</p>
      <button class="add-to-cart mt-4 bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-2 rounded-2xl">Add to Cart</button>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-5 flex flex-col items-center">
      <img src="images/c.jpg" alt="Candle" class="rounded-2xl mb-4">
      <h3 class="font-bold text-lg text-gray-800">Clash Royale</h3>
      <p class="text-gray-500">$22</p>
      <button class="add-to-cart mt-4 bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-2 rounded-2xl">Add to Cart</button>
    </div>
  </div>
</section>

<script src="js/main.js"></script>
</body>
</html>
