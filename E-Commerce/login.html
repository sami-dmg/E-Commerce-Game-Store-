<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Center - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-purple-100 to-pink-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-96">
        <h2 class="text-3xl font-bold text-center text-purple-700 mb-6">Login</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Username</label>
                <input type="text" id="loginUsername" required class="w-full p-3 border rounded-xl focus:outline-none focus:border-purple-500">
            </div>
            
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Password</label>
                <input type="password" id="loginPassword" required class="w-full p-3 border rounded-xl focus:outline-none focus:border-purple-500">
            </div>
            
            <button type="submit" class="w-full bg-purple-600 text-white p-3 rounded-2xl hover:bg-purple-700 transition font-bold shadow-md">Login</button>
        </form>

        <p class="text-center text-gray-600 mt-6">
            Don't have an account? <a href="signup.html" class="text-purple-600 font-bold hover:underline">Sign Up</a>
        </p>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
