<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Center - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = "welcome.html";
        }
    </script>
    <style>
        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover; 
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-pink-50 via-purple-50 to-blue-50 min-h-screen">

<nav class="bg-purple-600 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
  <h1 class="text-3xl font-bold hover:text-yellow-300 transition cursor-pointer" onclick="window.location.href='index.html'">🎮 Game Center</h1>
  <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-xl hover:bg-red-600 transition font-bold">Logout</button>
</nav>

<section class="p-6 mt-6">
  <h2 class="text-2xl font-bold mb-8 text-purple-700 border-b-2 border-purple-200 inline-block">Categories</h2>
  <div class="flex gap-6 overflow-x-auto pb-4 no-scrollbar">
    <div class="bg-purple-500 text-white px-8 py-5 rounded-2xl flex-shrink-0 hover:scale-105 transform transition cursor-pointer shadow-md font-bold text-center" onclick="window.location.href='category-action.html'">🔥 Action</div>
    <div class="bg-pink-500 text-white px-8 py-5 rounded-2xl flex-shrink-0 hover:scale-105 transform transition cursor-pointer shadow-md font-bold text-center" onclick="window.location.href='category-racing.html'">🏎️ Racing</div>
    <div class="bg-yellow-500 text-white px-8 py-5 rounded-2xl flex-shrink-0 hover:scale-105 transform transition cursor-pointer shadow-md font-bold text-center" onclick="window.location.href='category-adventure.html'">🌍 Adventure</div>
    <div class="bg-green-500 text-white px-8 py-5 rounded-2xl flex-shrink-0 hover:scale-105 transform transition cursor-pointer shadow-md font-bold text-center" onclick="window.location.href='category-strategy.html'">♟️ Strategy</div>
  </div>
</section>

<section class="p-6">
  <h2 class="text-2xl font-bold mb-6 text-purple-700 border-b-2 border-purple-200 inline-block">Trending Games</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8" id="featuredProducts">
    
    <div class="bg-white rounded-3xl shadow-xl p-5 flex flex-col items-center hover:shadow-2xl transition duration-300 border border-purple-100">
      <div class="w-full h-64 overflow-hidden rounded-2xl mb-4">
        <img src="images/angrybirds.jpg" alt="Angry Birds" class="w-full h-full object-cover">
      </div>
      <h3 class="font-bold text-lg text-gray-800">Angry Birds</h3>
      <p class="text-purple-600 font-bold">$25</p>
      <button class="mt-4 bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-2 rounded-2xl hover:brightness-110 transition shadow-md add-to-cart" data-name="Angry Birds" data-price="25">Add to Cart</button>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-5 flex flex-col items-center hover:shadow-2xl transition duration-300 border border-purple-100">
      <div class="w-full h-64 overflow-hidden rounded-2xl mb-4">
        <img src="images/coc.jpg" alt="Clash Of Clans" class="w-full h-full object-cover">
      </div>
      <h3 class="font-bold text-lg text-gray-800">Clash Of Clans</h3>
      <p class="text-purple-600 font-bold">$40</p>
      <button class="mt-4 bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-2 rounded-2xl hover:brightness-110 transition shadow-md add-to-cart" data-name="Clash Of Clans" data-price="40">Add to Cart</button>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-5 flex flex-col items-center hover:shadow-2xl transition duration-300 border border-purple-100">
      <div class="w-full h-64 overflow-hidden rounded-2xl mb-4">
        <img src="images/pubg.jpg" alt="PUBG" class="w-full h-full object-cover">
      </div>
      <h3 class="font-bold text-lg text-gray-800">PUBG</h3>
      <p class="text-purple-600 font-bold">$25</p>
      <button class="mt-4 bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-2 rounded-2xl hover:brightness-110 transition shadow-md add-to-cart" data-name="PUBG" data-price="20">Add to Cart</button>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-5 flex flex-col items-center hover:shadow-2xl transition duration-300 border border-purple-100">
      <div class="w-full h-64 overflow-hidden rounded-2xl mb-4">
        <img src="images/efootball.jpg" alt="eFootball" class="w-full h-full object-cover">
      </div>
      <h3 class="font-bold text-lg text-gray-800">eFootball</h3>
      <p class="text-purple-600 font-bold">$15</p>
      <button class="mt-4 bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-2 rounded-2xl hover:brightness-110 transition shadow-md add-to-cart" data-name="eFootball" data-price="15">Add to Cart</button>
    </div>

  </div>
</section>

<section class="p-6 max-w-2xl mx-auto bg-white rounded-3xl shadow-lg mb-12">
  <h2 class="text-2xl font-bold mb-4 text-purple-700">🛒 Your Cart</h2>
  <h1>Apply Coupon </h1>
  <ul id="cartItems" class="mb-4 list-none p-0">
      <li class="text-gray-400 italic">Your cart is empty.</li>
  </ul>
  
  <div class="flex flex-col sm:flex-row gap-4 items-center mb-6">
    <input type="text" id="discountCode" placeholder="Enter 'SAVE10'" class="p-3 border-2 border-purple-100 rounded-xl w-full focus:outline-none focus:border-purple-400">
    <button id="applyDiscount" class="bg-yellow-500 text-white px-6 py-3 rounded-xl hover:bg-yellow-600 transition font-bold w-full sm:w-auto">Apply</button>
  </div>
  
  <div class="flex justify-between items-center border-t pt-4">
      <p class="text-xl font-bold text-gray-700">Total: $<span id="totalPrice">0</span></p>
      <button id="checkoutBtn" class="bg-green-500 text-white px-8 py-3 rounded-2xl hover:bg-green-600 transition font-bold shadow-lg">Checkout Now</button>
  </div>
</section>

<div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center hidden z-[100]">
  <div class="bg-white p-8 rounded-3xl shadow-2xl w-[420px] text-center transform scale-95 transition-transform duration-300">
    <div class="text-5xl mb-4 text-green-500">✅</div>
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Payment Success</h2>
    
    <div class="overflow-y-auto max-h-[250px] pr-2 mb-6">
      <table class="w-full text-sm border-collapse">
        <thead class="border-b-2 border-purple-200 text-purple-700 font-bold sticky top-0 bg-white">
          <tr>
            <th class="py-2 text-left w-[55%]">Product</th>
            <th class="py-2 text-center w-[15%]">Qty</th>
            <th class="py-2 text-right w-[30%]">Price</th>
          </tr>
        </thead>
        <tbody id="modalCart" class="text-gray-700 divide-y divide-gray-100"></tbody>
      </table>
    </div>

    <div class="border-t border-purple-100 pt-4 space-y-2">
        <p class="flex justify-between font-medium text-gray-600">Discount: <span>-$<span id="modalDiscount">0.00</span></span></p>
        <p class="flex justify-between text-xl font-bold text-purple-700">Paid: <span>$<span id="modalTotal">0.00</span></span></p>
    </div>
    
    <button id="closeModal" class="mt-6 w-full bg-purple-600 text-white px-6 py-3 rounded-2xl hover:bg-purple-700 transition font-bold shadow-md">Close Receipt</button>
  </div>
</div>

<script>
  document.getElementById('logoutBtn').addEventListener('click', function() {
      localStorage.removeItem('isLoggedIn');
      window.location.href = 'welcome.html';
  });
</script>
<script src="js/main.js"></script>
</body>
</html>
